[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["The Hostprint Authors"]
description = "Fingerprint your system. See what changed."
keywords = ["diagnostics", "incident", "snapshot", "diff", "sre"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
hostprint-model = { path = "crates/hostprint-model", version = "0.1.0" }
hostprint-collectors = { path = "crates/hostprint-collectors", version = "0.1.0" }
hostprint-core = { path = "crates/hostprint-core", version = "0.1.0" }
hostprint-diff = { path = "crates/hostprint-diff", version = "0.1.0" }
hostprint-storage = { path = "crates/hostprint-storage", version = "0.1.0" }

anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
getrandom = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
thiserror = "2"
toml = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

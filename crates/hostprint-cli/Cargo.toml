[package]
name = "hostprint"
description = "Fingerprint your system. See what changed."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "hostprint"
path = "src/main.rs"

[features]
default = ["tui"]
# Interactive terminal UI (`hostprint tui`, `hostprint watch`). Build with
# --no-default-features for the smallest binary.
tui = ["dep:ratatui"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
flate2.workspace = true
hostprint-collectors.workspace = true
hostprint-core.workspace = true
hostprint-diff.workspace = true
hostprint-model.workspace = true
hostprint-storage.workspace = true
ratatui = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
